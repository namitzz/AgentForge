[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "Cost-aware control plane for Claude, Codex, and AI coding agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "AgentForge contributors" }]
keywords = [
    "ai-agents",
    "coding-agent",
    "claude-code",
    "codex",
    "multi-agent",
    "developer-tools",
    "ai-code-review",
    "cli-tool",
    "agent-orchestration",
    "ai-governance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12.0",
    "PyYAML>=6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
agentforge = "agentforge.main:main"

[project.urls]
Homepage   = "https://github.com/your-org/agentforge"
Repository = "https://github.com/your-org/agentforge"
Issues     = "https://github.com/your-org/agentforge/issues"
Changelog  = "https://github.com/your-org/agentforge/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agentforge*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
